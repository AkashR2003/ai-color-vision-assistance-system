<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1f3c88, #00b894);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: white;
            width: 380px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            text-align: center;
        }

        .login-card h1 {
            margin-bottom: 10px;
            color: #1f3c88;
        }

        .login-card p {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #162d66;
        }

        .register-link {
            margin-top: 20px;
        }

        .register-link a {
            color: #00b894;
            text-decoration: none;
            font-weight: bold;
        }

        .logo {
            font-size: 45px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="login-card">
    <div class="logo">🎨</div>

    <h1>AI Color Accessibility</h1>
    <p>Login to continue</p>

    <form method="POST">
        <input type="text" name="username" placeholder="Username or Email" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <div class="register-link">
        New user? <a href="/register">Create account</a>
    </div>
</div>

</body>
</html>
