<!DOCTYPE html>
<html>
<head>
    <title>Color Blindness Test</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
        }

        input {
            padding: 10px;
            width: 90%;
            margin-top: 10px;
        }

        button {
            padding: 12px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<h2>🧪 Color Blindness Test</h2>

<form method="POST" action="/test">

    {% for img in test_images %}

        <div class="card">
            <p><b>Image {{ loop.index }}:</b> What number do you see?</p>

            <img src="{{ url_for('static', filename=img.file) }}" width="250">

            <br>

            <input type="text"
                   name="answer{{ loop.index0 }}"
                   placeholder="Type your answer"
                   required>
        </div>

    {% endfor %}

    <button type="submit">Submit Test</button>

</form>

<br>
<a href="/dashboard">← Back to Dashboard</a>

</body>
</html>
